apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'io.github.takahirom.roborazzi'

import groovy.json.JsonSlurper
import java.security.MessageDigest

android {
    namespace 'com.wildlife.feasibility'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wildlife.feasibility'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-feasibility'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // Roborazzi renders Compose screens to PNG on the JVM so the redesign can be
    // reviewed without a device or emulator.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.systemProperty 'robolectric.graphicsMode', 'NATIVE'
                it.systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.work:work-runtime:2.11.2'

    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    testImplementation composeBom
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'
    implementation 'org.maplibre.gl:android-sdk:13.0.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.32.2'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.32.2'
}

tasks.register('verifyCatalogueContent') {
    group = 'verification'
    description = 'Fails when bundled catalogue assets do not match their reviewed sources.'
    doLast {
        def generated = rootProject.file('catalogues/generated/catalogue-inputs.json')
        if (!generated.isFile()) {
            throw new GradleException(
                'Catalogue build manifest is missing. Run .\\catalogue.ps1 build before building Android.'
            )
        }
        def manifest = new JsonSlurper().parse(generated)
        def sha256 = { File file ->
            def digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { stream ->
                byte[] buffer = new byte[1024 * 1024]
                int read
                while ((read = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        def stale = []
        manifest.files.each { relative, expected ->
            def source = rootProject.file(relative)
            if (!source.isFile() || sha256(source) != expected) {
                stale.add(relative)
            }
        }
        manifest.android_assets.each { name, expected ->
            def asset = file("src/main/assets/catalogues/${name}")
            if (!asset.isFile() || sha256(asset) != expected) {
                stale.add("app asset ${name}")
            }
        }
        if (!stale.isEmpty()) {
            throw new GradleException(
                'Bundled catalogue is stale: ' + stale.join(', ') +
                '. Run .\\catalogue.ps1 build and commit the generated files.'
            )
        }
    }
}

tasks.named('preBuild').configure { dependsOn('verifyCatalogueContent') }
